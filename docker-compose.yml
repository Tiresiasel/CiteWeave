# Docker Compose configuration for CiteWeave local infrastructure (Neo4j + Qdrant + GROBID)

services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: citeweave-qdrant
    ports:
      - "127.0.0.1:6333:6333"  # REST API
      - "127.0.0.1:6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./qdrant_config:/qdrant/config
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__ENABLE_TLS=false
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # The upstream image does not ship curl/wget. Use bash's /dev/tcp so
      # Docker health reflects the actual API status instead of a missing
      # binary. Yes, healthchecks failing because the healthchecker is missing
      # is exactly the kind of joke Docker tells with a straight face.
      test: >
        bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
        printf "GET /collections HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
        head -n 1 <&3 | grep -q " 200 "' 
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: citeweave-grobid
    ports:
      - "127.0.0.1:8070:8070"  # GROBID API
    environment:
      - JAVA_OPTS=-Xmx4g
    restart: unless-stopped
    healthcheck:
      # The GROBID image also lacks curl. Keep the check self-contained.
      test: >
        bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8070 &&
        printf "GET /api/isalive HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
        head -n 1 <&3 | grep -q " 200 "' 
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  neo4j:
    image: neo4j:5.15
    container_name: citeweave-neo4j
    ports:
      - "127.0.0.1:7687:7687"  # Bolt protocol
      - "127.0.0.1:7474:7474"  # HTTP web UI
    env_file:
      - .env
    environment:
      - NEO4J_AUTH=neo4j/${CITEWEAVE_NEO4J_PASSWORD:?set CITEWEAVE_NEO4J_PASSWORD in .env before starting Neo4j}
      - NEO4J_dbms_security_auth__enabled=true
    # Neo4j can leave a stale PID file after an unclean container restart;
    # remove it before handing off to the stock server command.
    command: >
      bash -lc 'rm -f /var/lib/neo4j/run/neo4j.pid /var/lib/neo4j/run/*.pid 2>/dev/null || true; exec /var/lib/neo4j/bin/neo4j console'
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
  neo4j_data:
    driver: local 