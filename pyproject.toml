[project]
name = "citeweave"
version = "0.1.0"
description = "Citation-aware academic knowledge graph and RAG system"
authors = [
    {name = "Yinji Zhou"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nltk>=3.9.1",
    "pdfplumber>=0.11.7",
    "pillow>=11.3.0",
    "pymupdf>=1.26.3",
    "pytesseract>=0.3.13",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.8",
    "langchain-core>=0.1.0",
    "qdrant-client>=1.17.1",
    "sentence-transformers>=2.2.2",
    "PyPDF2>=3.0.0",
    "lxml>=4.9.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "neo4j>=5.0.0",
    "langgraph>=0.5.0",
    "langchain-ollama>=0.3.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tiktoken>=0.5.0",
    "prompt-toolkit>=3.0.0",
    "PyYAML>=6.0.0"
]

[project.scripts]
citeweave = "src.core.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Poetry tool configuration
packages = [
    { include = "src" }
]
exclude = [
    "src/data/**",
    "data/**",
    "test_files/**",
    "tests/manual/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "integration: requires local services or external APIs",
    "manual: script-like checks excluded from default discovery",
]

[tool.ruff]
line-length = 120
exclude = [
    "tests/manual",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line length; defer until code layout pass
]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally install import stubs or configure env/logging
# before importing the package under test.
"src/core/cli.py" = ["E402"]
"tests/test_batch_tracker_progress.py" = ["E402"]
"tests/test_cli_batch_upload_sequential.py" = ["E402"]
"tests/test_cli_routes_command.py" = ["E402"]
"tests/test_query_history.py" = ["E402"]
