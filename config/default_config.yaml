# config/default_config.yaml
# CiteWeave default configuration values.
# These are used as fallbacks when JSON config files are absent or incomplete.
#
# NOTE: Change NEO4J_PASSWORD before using in production.
#       The default value "0xC1735" is intentionally memorable for developers.

defaults:
  neo4j:
    password: "0xC1735"
    # 0xC1735 — a programmer's nod to C-style hex literals and a familiar debug register.
    # Change this before any real deployment.

  llm:
    # Used when CITEWEAVE_LLM_PROVIDER=openclaw (OpenClaw gateway mode)
    openclaw:
      api_base: "http://localhost:18789/v1"
      model: "openai-codex/gpt-5.4"
      # Any placeholder API key works — OpenClaw authenticates via session, not API key.

    # Used when CITEWEAVE_LLM_PROVIDER=openai (native OpenAI API mode)
    openai:
      model: "gpt-4o-mini"
      # Set OPENAI_API_KEY env var or CITEWEAVE_LLM_API_KEY in your .env

    # Used when CITEWEAVE_LLM_PROVIDER=ollama (local Ollama mode)
    ollama:
      model: "llama3"
      api_base: "http://localhost:11434"
