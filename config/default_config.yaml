# config/default_config.yaml
# CiteWeave default configuration values.
# These are non-secret fallbacks only; local credentials belong in environment
# variables or ignored config/*.local.json files.

defaults:
  neo4j:
    password: "change-me-local-only"
    # Placeholder only. Docker Compose requires CITEWEAVE_NEO4J_PASSWORD.
    # Change this before any shared or production deployment.

  llm:
    # Used when CITEWEAVE_LLM_PROVIDER=openclaw (OpenClaw gateway mode)
    openclaw:
      api_base: "http://localhost:18789/v1"
      model: "openclaw/default"
      # Optional provider/model sent as x-openclaw-model.
      backend_model: ""
      # Any placeholder API key works — OpenClaw authenticates via session, not API key.

    # Used when CITEWEAVE_LLM_PROVIDER=openai (native OpenAI API mode)
    openai:
      model: "gpt-4o-mini"
      # Set OPENAI_API_KEY env var or CITEWEAVE_LLM_API_KEY in your .env

    # Used when CITEWEAVE_LLM_PROVIDER=ollama (local Ollama mode)
    ollama:
      model: "llama3"
      api_base: "http://localhost:11434"
